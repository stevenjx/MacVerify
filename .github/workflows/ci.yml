name: CI

# 三件事分开跑，任何一个失败都能直接看出是哪一类问题：
#   verify   —— 单元测试 + 两个自检脚本（数据与文案的正确性）
#   build    —— App 本体能否编译（SPM 测试跑不到 @main 与 SwiftUI 视图）
#   package  —— 发布 release 时才跑：构建通用二进制与 DMG，校验后作为 release 附件上传
#
# 为什么 package 挂在 release 而不是 tag：DMG 只应存在于已经发布的版本上，
# 推一个 tag 就产包会让「有包但没发布」的状态变得可能。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # package 需要往 release 上传 dmg
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 单元测试与自检
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 环境信息
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: 缓存 SwiftPM 构建目录
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'MacVerify/**/*.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # 用例全部基于构造数据，不依赖电池、内建屏等真实硬件
      - name: 单元测试
        run: swift test --parallel

      # 这两项与单元测试互补：用例验证判定逻辑，脚本验证表与文案本身
      - name: 机型基线自检
        run: python3 Scripts/check_baseline.py

      - name: 本地化查漏
        run: python3 Scripts/check_localization.py

  build:
    name: 编译 App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('MacVerify.xcodeproj/project.pbxproj', 'MacVerify/**/*.swift') }}
          restore-keys: ${{ runner.os }}-dd-

      # 只验证源码与工程配置能否编译，不做签名
      - name: xcodebuild（Debug）
        run: |
          set -o pipefail
          xcodebuild -project MacVerify.xcodeproj -scheme MacVerify \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  package:
    name: 打包并上传到 release
    if: github.event_name == 'release'
    needs: [verify, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 读取版本号
        id: version
        run: |
          version=$(grep -m1 'MARKETING_VERSION = ' MacVerify.xcodeproj/project.pbxproj \
            | sed 's/.*MARKETING_VERSION = //; s/;.*//')
          tag="${GITHUB_REF_NAME#v}"
          echo "工程版本：$version"
          echo "标签版本：$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::工程 MARKETING_VERSION（$version）与标签（$tag）不一致，请先改版本号再打标签"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: 构建通用二进制
        run: |
          set -o pipefail
          xcodebuild -project MacVerify.xcodeproj -scheme MacVerify \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath release ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build

      - name: 生成 DMG
        run: |
          set -euo pipefail
          mkdir -p dist/staging
          cp -R release/Build/Products/Release/MacVerify.app dist/staging/
          ln -s /Applications dist/staging/Applications
          # ad-hoc 签名：与本地发布流程一致，不冒充已公证
          codesign --force --deep -s - dist/staging/MacVerify.app
          hdiutil create -volname "MacVerify" -srcfolder dist/staging -ov -format UDZO \
            "dist/MacVerify-${{ steps.version.outputs.value }}.dmg"

      - name: 校验产物
        run: |
          set -euo pipefail
          dmg="dist/MacVerify-${{ steps.version.outputs.value }}.dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | tail -1)
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          lipo -info "$mount/MacVerify.app/Contents/MacOS/MacVerify"
          # 只有 arm64 的包在 Intel Mac 上会报 "not supported on this Mac"，
          # 而且只有拿到那台机器上才会发现——所以在这里就拦住
          archs=$(lipo -archs "$mount/MacVerify.app/Contents/MacOS/MacVerify")
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::DMG 缺少 $arch 分片（实际：$archs），该架构的 Mac 打不开"; exit 1 ;;
            esac
          done
          echo "架构：$archs"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$mount/MacVerify.app/Contents/Info.plist"

      - uses: actions/upload-artifact@v7
        with:
          name: MacVerify-${{ steps.version.outputs.value }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # release 附件才是对外发出去的那一份，artifact 只是构建留存
      - name: 上传到 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
